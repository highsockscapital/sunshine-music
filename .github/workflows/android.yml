name: Build APK

# Sunshine Music CI.
#
# Mirrors Sunshinussy's build-apk.yml (JDK + setup-gradle + setup-android + unit tests +
# debug APK + upload-artifact), with three deliberate differences from upstream Gramophone:
#
#   1. DEBUG build, not release. Upstream signs the release APK with the maintainer's keystore
#      secrets; we have none, and a debug APK sideloads perfectly well for personal use.
#   2. No Telegram upload. That was the maintainer's distribution channel.
#   3. JDK 21, because Gradle 9.4.1 requires it. Sunshinussy uses 17.

on:
  workflow_dispatch:
  push:
    # `beta` is the upstream branch name. `main` is here so the workflow also fires if the branch
    # is ever renamed. `sunshine-music` is this project's working branch, so pushing it builds.
    branches: [ "beta", "main", "sunshine-music" ]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the build derives versionName from `git rev-parse --short=7 HEAD`.
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Overrides the action's default list, which includes the obsolete "tools" package.
          #
          # Deliberately does NOT install a platform. compileSdk is 37 and android-37 is a
          # PREVIEW platform: the default sdkmanager channel stops at 36, so requesting it by
          # name dies with "Failed to find package 'platforms;android-37'". It does exist, but
          # only under a later channel (android-37.0 / 37.1 / 37.2, plus a codename CANARY).
          #
          # Nothing needs installing anyway: the ubuntu runner image already ships
          # android-37.0, android-37.1, android-37.2 and build-tools 37.0.0. Upstream
          # Gramophone builds on that same preinstalled SDK and has no setup-android step.
          packages: 'platform-tools'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # app/build.gradle.kts does `resolveProperties("releaseType")!!`, so this must exist.
      # It is gitignored and regenerated on every run.
      - name: Set release type
        run: echo releaseType=CI > package.properties

      # assembleDebug ships no R8 pass and no resource shrinking, which split the app into
      # 19 dex files totalling 81 MiB and produced a 93.8 MB APK. Upstream builds release.
      - name: Build APK (clean) — release
        run: ./gradlew clean :app:assembleRelease --stacktrace --max-workers=2

      - name: Rename APK to sunshine-music
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK_FILE="$(find app/build/outputs -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_FILE" ]; then
            echo "::error::no APK produced under app/build/outputs"
            find app/build/outputs -maxdepth 4 || true
            exit 1
          fi
          echo "found $APK_FILE"
          cp "$APK_FILE" dist/sunshine-music.apk
          ls -lh dist/*.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sunshine-music
          path: dist/*.apk

      - name: Run Android unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --max-workers=2

      # Gradle's console output truncates assertion messages to the first frame, which makes a
      # failing fixture impossible to diagnose. The HTML and XML reports carry the full diff.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
