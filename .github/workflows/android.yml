name: Build APK

# Sunshine Music CI.
#
# Mirrors Sunshinussy's build-apk.yml (JDK + setup-gradle + setup-android + unit tests +
# debug APK + upload-artifact), with three deliberate differences from upstream Gramophone:
#
#   1. DEBUG build, not release. Upstream signs the release APK with the maintainer's keystore
#      secrets; we have none, and a debug APK sideloads perfectly well for personal use.
#   2. No Telegram upload. That was the maintainer's distribution channel.
#   3. JDK 21, because Gradle 9.4.1 requires it. Sunshinussy uses 17.

on:
  workflow_dispatch:
  push:
    # `beta` is the upstream branch name. `main` is here so the workflow also fires if the branch
    # is ever renamed. `sunshine-music` is this project's working branch, so pushing it builds.
    branches: [ "beta", "main", "sunshine-music" ]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the build derives versionName from `git rev-parse --short=7 HEAD`.
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Override the default list, which includes the obsolete "tools" package.
          # build-tools is deliberately omitted so AGP picks its own default for compileSdk 37.
          packages: 'platform-tools platforms;android-37'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # app/build.gradle.kts does `resolveProperties("releaseType")!!`, so this must exist.
      # It is gitignored and regenerated on every run.
      - name: Set release type
        run: echo releaseType=CI > package.properties

      - name: Run Android unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --max-workers=2

      - name: Build APK (clean) — debug
        run: ./gradlew clean :app:assembleDebug --stacktrace --max-workers=2

      - name: Rename APK to sunshine-music
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/sunshine-music.apk
          ls -lh dist/*.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sunshine-music
          path: dist/*.apk